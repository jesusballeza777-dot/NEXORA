<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blockouts de Roblox</title>
<style>
  :root { --bg: #1f2b22; --panel: #2c3b2f; --ink: #f6ecd9; --muted: #b9ad96; --accent: #e8a33d; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 16px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  header p { margin: 0; color: var(--muted); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; padding: 0 16px 16px; }
  figure { margin: 0; background: var(--panel); border-radius: 12px; overflow: hidden; }
  figure img { display: block; width: 100%; aspect-ratio: 1; background: radial-gradient(circle at 50% 35%, #a5c98a, #47704e); }
  figcaption { padding: 6px 8px; font-size: 13px; }
  figcaption small { color: var(--muted); display: block; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<header>
  <h1>Blockouts de Roblox</h1>
  <p>Generado desde <code>Client/Creatures/CreatureBuilder.luau</code> (mismas piezas que en Roblox). Iluminación aproximada.</p>
</header>
<div id="grid"></div>
<script type="module">
import * as THREE from 'three';
const ALL = __DATA__;
// ?front (cámara de frente), ?form=Brote|Tallado, ?big (tarjetas grandes para revisar caras)
const params = new URLSearchParams(location.search);
const front = params.has('front');
const CREATURES = ALL.filter((c) => !params.get('form') || c.form === params.get('form'));
if (params.has('big')) document.getElementById('grid').style.gridTemplateColumns = 'repeat(auto-fill, minmax(300px, 1fr))';
const SIZE = 320;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true, alpha: true });
renderer.setSize(SIZE, SIZE);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
const geo = {
  Ellipsoid: new THREE.SphereGeometry(0.5, 32, 20),
  Ball: new THREE.SphereGeometry(0.5, 32, 20),
  Block: new THREE.BoxGeometry(1, 1, 1),
  Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 28).rotateZ(Math.PI / 2), // eje X como en Roblox
};
function build(c) {
  const g = new THREE.Group();
  for (const p of c.parts) {
    const color = new THREE.Color().setRGB(p.color[0], p.color[1], p.color[2], THREE.SRGBColorSpace);
    const mat = p.neon
      ? new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.4) })
      : new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0 });
    if (p.transparency > 0) { mat.transparent = true; mat.opacity = 1 - p.transparency; }
    const m = new THREE.Mesh(geo[p.shape] || geo.Block, mat);
    const [x, y, z, a, b, cc, d, e, f, gg, h, i] = p.cf;
    const mtx = new THREE.Matrix4().set(a, b, cc, x, d, e, f, y, gg, h, i, z, 0, 0, 0, 1);
    mtx.multiply(new THREE.Matrix4().makeScale(p.size[0], p.size[1], p.size[2]));
    m.matrixAutoUpdate = false; m.matrix.copy(mtx);
    m.castShadow = true; m.receiveShadow = true;
    g.add(m);
  }
  return g;
}
const grid = document.getElementById('grid');
for (const c of CREATURES) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xfff1dc, 0x4a5a3a, 1.3));
  const sun = new THREE.DirectionalLight(0xffe6c4, 2.2);
  sun.position.set(4, 8, 6); sun.castShadow = true; scene.add(sun);
  const g = build(c);
  g.rotation.y = front ? 0 : -0.6;
  g.updateMatrixWorld(true);
  scene.add(g);
  const box = new THREE.Box3().setFromObject(g);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const d = Math.max(size.x, size.y, size.z) * (front ? 1.25 : 2.0);
  const cam = new THREE.PerspectiveCamera(34, 1, 0.1, 200);
  cam.position.set(center.x + (front ? 0 : d * 0.15), center.y + d * (front ? 0.08 : 0.22), center.z + d);
  cam.lookAt(center);
  renderer.render(scene, cam);
  const fig = document.createElement('figure');
  const img = new Image(); img.src = renderer.domElement.toDataURL('image/png'); img.alt = c.name;
  const cap = document.createElement('figcaption');
  cap.innerHTML = `${c.name}<small>${c.id} · ${c.form}${c.opaco ? ' · Opaco' : ''}</small>`;
  fig.append(img, cap); grid.append(fig);
}
document.body.dataset.ready = '1';
</script>
</body>
</html>
